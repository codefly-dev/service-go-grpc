syntax = "proto3";
package api;

option go_package = "codefly-base/pkg/gen;gen";

import "google/api/annotations.proto";

message VersionRequest {
}

message VersionResponse {
    string version = 1;
}

service WebService {
    rpc Version(VersionRequest) returns (VersionResponse) {
        option (google.api.http) = {
            get: "/version"
        };
    }
}
