name: GoReleaser

on:
  push:
    tags:
      - 'v*'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false
      - run: go test -v ./...

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Install Syft for archive SBOMs
        id: syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          syft-version: v1.44.0
      - name: Run CGO-capable GoReleaser
        run: >-
          docker run --rm
          -e GITHUB_TOKEN
          -v "$GITHUB_WORKSPACE:/workspace"
          -v "$SYFT_PATH:/usr/local/bin/syft:ro"
          -w /workspace
          ghcr.io/goreleaser/goreleaser-cross:v1.27.1-1
          release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          SYFT_PATH: ${{ steps.syft.outputs.cmd }}
