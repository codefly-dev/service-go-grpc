name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Verify generated-service dependency lock
        run: go test ./... -run '^Test(FactoryDependencyLocksMatchBase|BaseGeneratedServiceBuildsFromCleanModuleCache)$' -count=1

  ci:
    needs: dependency-lock
    uses: codefly-dev/core/.github/workflows/go-service-ci.yml@v0.19.10

  packaging:
    name: packaging / ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Execute static and native runtime contracts
        shell: bash
        env:
          CODEFLY_PACKAGING_IMAGE_TEST: '1'
          CODEFLY_PACKAGING_EVIDENCE_DIR: ${{ runner.temp }}/packaging
        run: |
          mkdir -p "$CODEFLY_PACKAGING_EVIDENCE_DIR"
          go test ./... -run '^TestPackagingImage$' -count=1 -v -timeout=25m 2>&1 | tee "$CODEFLY_PACKAGING_EVIDENCE_DIR/test.log"
      - name: Install the release inventory tool
        id: syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.44.0
      - name: Inventory the exact tested images
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
          EVIDENCE: ${{ runner.temp }}/packaging
        run: |
          for archive in "$EVIDENCE"/*/*/image.tar; do
            "$SYFT" "docker-archive:$archive" -o "cyclonedx-json=${archive%/*}/sbom.cdx.json"
            sha256sum "$archive" > "${archive%/*}/image.tar.sha256"
          done
      - name: Retain image qualification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packaging-${{ matrix.arch }}
          path: ${{ runner.temp }}/packaging
          retention-days: 7
          compression-level: 0
