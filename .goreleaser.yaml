version: 2

sboms:
  - id: archives
    artifacts: archive
    documents:
      - "${artifact}.sbom.json"
    disable: false

project_name: service-go-grpc

# A prerelease tag (a `codefly publish dev` build, v<version>-dev.<sha>) is
# published as a GitHub prerelease, never as Latest, so `version: latest` can
# never resolve to a dev build. Release tags are unaffected.
release:
  prerelease: auto

builds:
  - id: darwin-amd64
    binary: service-go-grpc
    env:
      - CGO_ENABLED=1
      - CC=o64-clang
      - CXX=o64-clang++
    goos:
      - darwin
    goarch:
      - amd64
  - id: darwin-arm64
    binary: service-go-grpc
    env:
      - CGO_ENABLED=1
      - CC=oa64-clang
      - CXX=oa64-clang++
    goos:
      - darwin
    goarch:
      - arm64
  - id: linux-amd64
    binary: service-go-grpc
    env:
      - CGO_ENABLED=1
      - CC=x86_64-linux-gnu-gcc
      - CXX=x86_64-linux-gnu-g++
    goos:
      - linux
    goarch:
      - amd64

archives:
  - id: default
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
